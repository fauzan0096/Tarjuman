<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8e7">
<meta name="robots" content="noindex">
<link rel="manifest" href="qari-manifest.json">
<link rel="icon" href="qari-192.png">
<link rel="apple-touch-icon" href="qari-192.png">
<title>Nanhe Qari</title>
<style>:root{--bg:#fff8e7;--ink:#2b2a33;--mute:#6b6a75;--card:#fff;--line:#eadfbe;--blue:#2b8de0;--green:#2fbf71;--warn:#e8883a;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#view{max-width:560px;margin:0 auto;padding:0 14px 40px;min-height:100vh}
.ar{font-family:"Noto Naskh Arabic","Geeza Pro","Scheherazade New","Amiri","Traditional Arabic","Arial",serif;direction:rtl;line-height:1.7}
.ar2{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic","Geeza Pro","Jameel Noori Nastaleeq","Arial",serif;direction:rtl;line-height:2.1;text-align:right}
.hero{text-align:center;padding:30px 0 10px}.hero .logo{font-size:64px}.hero h1{margin:4px 0;font-size:34px}.hero p{color:var(--mute);margin:0}
h2{font-size:19px;margin:16px 0 8px}
.top{display:flex;align-items:center;gap:8px;padding:12px 0}.top h1{font-size:21px;margin:0;flex:1}
.ib{background:#fff;border:2px solid var(--line);border-radius:14px;min-width:48px;height:48px;font-size:22px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border-radius:16px;padding:10px;text-align:center;border:2px solid var(--line)}.stat span{font-size:22px;display:block}.stat b{font-size:22px}.stat small{display:block;color:var(--mute)}
.week{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}.dots{display:flex;gap:6px}.dot{font-size:24px;color:#cbb}
.today{border-radius:22px;padding:18px;color:#fff;position:relative;margin:10px 0;overflow:hidden}.today small{opacity:.9}.today .tt{font-size:22px;font-weight:800;margin:6px 0 14px;max-width:80%}.today .em{position:absolute;right:14px;top:10px;font-size:54px}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:14px 18px;cursor:pointer;margin:6px 4px 6px 0;min-height:52px}
.btn.go{background:var(--green);color:#fff;box-shadow:0 4px 0 #1f8a52}.btn.white{background:#fff;color:#222}.btn.blue{background:var(--blue);color:#fff;box-shadow:0 4px 0 #1b66a8}.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}.btn.bad{background:#fff;color:#c33;border:2px solid #e9b5b5}.btn.small{min-height:44px;padding:8px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.tile{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 8px;cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center;gap:6px}.tile span{font-size:34px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin:10px 0;text-align:center}
.card.tip{background:#eaf6ff;border-color:#bcdcf7;text-align:left}
.card.dua .big2{font-size:26px}.rom{color:var(--mute);margin:6px 0}.mean{margin:8px 0;color:#444}
.tag{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:20px;padding:4px 12px;font-weight:700;margin:10px 0 0}
.ar.big{font-size:min(30vw,150px)}.ar.wordbig{font-size:min(16vw,80px)}.ar.long{font-size:26px;line-height:2}.ar.wbig{font-size:30px}.ar.fbig{font-size:54px}.fbig2{font-size:26px;color:var(--mute)}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.form{background:#fff8e7;border-radius:12px;padding:6px 0}.nm{font-weight:800;margin:6px 0}
.pic{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:8px 0}.pic .em{font-size:44px}.pic>div{flex:1;text-align:center}
.chip{background:#fff3df;border:2px solid #f3d9a8;border-radius:14px;padding:8px 12px;margin:6px 0;font-size:15px}.chip.warn{background:#ffe9e0;border-color:#f3b9a4}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.note{color:var(--mute);font-size:15px}.note.warn,.warn{color:#b3541a}
.lhead{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 -14px;color:#fff}.lhead .ib{background:rgba(255,255,255,.25);border:0;color:#fff;min-width:42px;height:42px}
.pbar{flex:1;height:14px;background:rgba(255,255,255,.35);border-radius:8px;overflow:hidden}.pbar i{display:block;height:100%;width:0;background:#fff;border-radius:8px;transition:width .3s}
.lbody{padding-bottom:110px}.lfoot{position:fixed;left:0;right:0;bottom:0;background:#fff8e7ee;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:center;gap:8px;border-top:2px solid var(--line)}
.lfoot .btn{flex:1;max-width:320px}.lfoot .btn.small{flex:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cell{background:#fff;border:2px solid var(--line);border-radius:14px;font-size:34px;padding:8px 2px;cursor:pointer}.cell.sm{font-size:20px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.opt{background:#fff;border:3px solid var(--line);border-radius:18px;font-size:38px;min-height:84px;cursor:pointer;padding:6px}.opt.sm{font-size:22px}.opt.xs{font-size:15px;line-height:1.7}.opt.good{background:#d7f5e1;border-color:var(--green)}.opt.bad{background:#fde2e2;border-color:#e9a0a0}
.big3{font-size:64px}.stars{font-size:38px;margin:8px 0}
.phase{display:flex;align-items:center;gap:10px;color:#fff;border-radius:16px;padding:10px 14px;margin:18px 0 8px;font-size:18px}.phase span{font-size:26px}
.nodes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.node{width:62px;height:70px;border-radius:50%;border:4px solid #d8cfae;background:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}.node i{font-style:normal;font-weight:800;font-size:18px}.node u{text-decoration:none;font-size:9px;line-height:1}
.node.done{background:#d7f5e1;border-color:var(--green)}.node.now{border-color:#f5b800;box-shadow:0 0 0 5px #ffe9a3}.node.lock{opacity:.5}
.list{display:flex;flex-direction:column;gap:8px}.srow{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;font:inherit;cursor:pointer;text-align:right}.srow .se{font-size:30px}.srow .st{flex:1;font-size:19px;font-weight:700}.srow .sc{font-size:20px}
.sent{margin:0 0 10px;padding:6px 8px;border-radius:10px;font-size:22px;cursor:pointer}.sent.on{background:#fff0b8}
.story h2{margin:6px 0}
.qq{font-size:24px;font-weight:700}.ans{margin-top:10px;padding:10px;background:#eaf9ef;border-radius:14px}.ab{font-size:30px;font-weight:800}.qrow{display:flex;gap:8px;justify-content:center;margin-top:8px}
.kidrow{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;font:inherit;font-size:20px;margin:6px 0;cursor:pointer}.kav{font-size:34px}
.avrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.avb{font-size:28px;background:#fff;border:3px solid var(--line);border-radius:14px;width:52px;height:52px;cursor:pointer}.avb.on{border-color:var(--green);background:#e6f8ed}
.chipb{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 14px;font:inherit;cursor:pointer}.chipb.on{background:var(--green);color:#fff;border-color:var(--green)}
input[type=text]{width:100%;font:inherit;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:14px}
.card ul,.card ol{text-align:left;padding-left:20px}.card ul li{margin-bottom:8px}
.tbar{display:flex;align-items:center;gap:8px;justify-content:center;margin:8px 0;flex-wrap:wrap}
.hid{background:#ffd77a;color:transparent;border-radius:8px;cursor:pointer}
.ayah{position:relative}
.badge{font-weight:800;color:#a06b00}
.conf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}.conf span{position:absolute;top:-40px;animation:fall 3s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222d;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;max-width:88%;text-align:center}#toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.conf span{animation-duration:.01s}}
</style>
</head>
<body>
<main id="view"></main>

<script>
(()=>{'use strict';
/* ===== CONTENT (Arabic text must be reviewed by a qualified teacher/qari) ===== */
const FATHA='َ',KASRA='ِ',DAMMA='ُ',SUKUN='ْ',SHADDA='ّ',
  FATHATAN='ً',KASRATAN='ٍ',DAMMATAN='ٌ',SALIF='ٰ',SKASRA='ٖ',SDAMMA='ٗ';

const LET=[
['ا','أَلِف','Alif',"'",'أَسَد','Sher','🦁','Munh aur halq ki khali jagah se, awaaz ko narmi se kheench kar. Alif khud harkat nahi leta.',''],
['ب','بَاء','Be','b','بَطَّة','Batakh','🦆','Dono honth aapas mein milne se.','q'],

['ث','ثَاء','Se','th','ثَعْلَب','Lomdi','🦊','Zabaan ki nok upar ke agle daanton ke kinare se, halki hawa ke saath. (Seen ki tarah daanton ke peeche nahi.)',''],
['ج','جِيم','Jeem','j','جَمَل','Unt','🐪','Zabaan ka beech wala hissa upar taalu se.','q'],
['ح','حَاء','Bari Haa','H','حِصَان','Ghoda','🐴','Halq ke beech se, patli saans jaisi awaaz. (Chhoti Haa se alag hai.)',''],
['خ','خَاء','Khaa','kh','خَرُوف','Bher','🐑','Halq ke shuru wale hisse se, moti awaaz.','h'],
['د','دَال','Daal','d','دُبّ','Reechh','🐻','Zabaan ki nok upar ke agle daanton ki jad se.','qn'],
['ذ','ذَال','Zaal','dh','ذُرَة','Makka','🌽','Zabaan ki nok upar ke agle daanton ke kinare se.','n'],

['ش','شِين','Sheen','sh','شَمْس','Suraj','☀️','Zabaan ka beech wala hissa taalu se, hawa phailti hui.',''],
['ص','صَاد','Suwaad','S','صَقْر','Baaz','🦅','Zabaan ki nok neeche ke agle daanton ke kinare se, moti awaaz.','h'],

['ط','طَاء','Toay','T','طَائِر','Parinda','🐦','Zabaan ki nok upar ke agle daanton ki jad se, moti awaaz.','hq'],

['ع','عَيْن','Ain',"'",'عَيْن','Aankh','👁️','Halq ke beech se, halq ko dabate hue.',''],
['غ','غَيْن','Ghain','gh','غَيْمَة','Badal','☁️','Halq ke shuru wale hisse se, moti awaaz.','h'],
['ف','فَاء','Fe','f','فِيل','Haathi','🐘','Neeche ke honth ka andar wala hissa upar ke agle daanton se.',''],

['ك','كَاف','Kaaf','k','كِتَاب','Kitaab','📖','Zabaan ki jad se thoda aage ka hissa taalu se, patli awaaz.',''],
['ل','لَام','Laam','l','لَيْمُون','Nimbu','🍋','Zabaan ka kinara upar ke agle daanton ke aas-paas se.',''],
['م','مِيم','Meem','m','مَوْز','Kela','🍌','Dono honth milane se, nak se halki ghunna.',''],

['و','وَاو','Waaw','w','وَرْدَة','Phool','🌹','Dono honth gol karke.','n'],

 'ح':'Bari Haa (ح) halq ke beech se, Chhoti Haa (ه) halq ki gehrai se.',
 'ع':'Ain (ع) halq ke beech se dabake, Hamza (ء) halq ki gehrai se ruk kar.',

const PIC_NOTE='Har harf ke saath ek tasveer wala lafz hai. Bachcha tasveer dekh kar lafz ka pehla harf pehchane.';

/* ===== Duas for little children (one per lesson at the start) ===== */
/* [Arabic, Roman, Urdu meaning, when, source] */
const DUAS=[
['بِسْمِ اللَّهِ','Bismillah','Allah ke naam se.','Khaana shuru karte waqt','Bukhari'],
['الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ','Alhamdu lillahil lazi at-amana wa saqana wa ja-alana muslimeen','Allah ka shukr jisne humein khilaya, pilaya aur musalman banaya.','Khaana khane ke baad','Abu Dawud, Tirmizi'],
['بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا','Bismika Allahumma amutu wa ahya','Ae Allah! Tere hi naam se marta hoon aur jeeta hoon.','Sone se pehle','Bukhari'],
['الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ','Alhamdu lillahil lazi ahyana ba-da ma amatana wa ilaihin nushur','Allah ka shukr jisne humein maut (neend) ke baad zinda kiya, aur usi ki taraf lautna hai.','Neend se uthne par','Bukhari'],
['اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ','Allahumma inni a-udhu bika minal khubuthi wal khaba-ith','Ae Allah! Main buri cheezon se teri panah maangta hoon.','Bait-ul-khala (bathroom) jaane se pehle','Bukhari, Muslim'],
['غُفْرَانَكَ','Ghufranak','Ae Allah! Main teri maafi chahta hoon.','Bathroom se nikal kar','Abu Dawud, Tirmizi'],
['بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ','Bismillahi tawakkaltu alallah, wa la hawla wa la quwwata illa billah','Allah ke naam se, maine Allah par bharosa kiya. Taqat aur himmat sirf Allah se hai.','Ghar se nikalte waqt','Abu Dawud, Tirmizi'],
['اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ','Allahummaf tah li abwaba rahmatik','Ae Allah! Mere liye apni rehmat ke darwaze khol de.','Masjid mein dakhil hote waqt','Muslim'],
['اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ','Allahumma inni as-aluka min fazlik','Ae Allah! Main tujh se tera fazl maangta hoon.','Masjid se nikalte waqt','Muslim'],
['الْحَمْدُ لِلَّهِ','Alhamdu lillah','Saari tareef Allah ke liye hai.','Chheenk aane par','Bukhari'],
['يَرْحَمُكَ اللَّهُ','Yarhamukallah','Allah tum par reham kare.','Kisi ko chheenk aaye aur woh Alhamdulillah kahe','Bukhari'],
['يَهْدِيكُمُ اللَّهُ وَيُصْلِحُ بَالَكُمْ','Yahdikumullahu wa yuslihu balakum','Allah tumhein hidayat de aur tumhara haal theek kare.','Jab koi "Yarhamukallah" kahe','Bukhari'],
['الْحَمْدُ لِلَّهِ الَّذِي كَسَانِي هَذَا الثَّوْبَ وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ','Alhamdu lillahil lazi kasani haza-ssawba wa razaqanihi min ghayri hawlin minni wa la quwwah','Allah ka shukr jisne mujhe yeh kapda pehnaya.','Naya kapda pehente waqt','Abu Dawud, Tirmizi'],
['السَّلَامُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ','Assalamu alaikum wa rahmatullahi wa barakatuh','Tum par salaamati, Allah ki rehmat aur barkat ho.','Kisi se milte waqt','Abu Dawud, Tirmizi'],
['وَعَلَيْكُمُ السَّلَامُ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ','Wa alaikumus salam wa rahmatullahi wa barakatuh','Aur tum par bhi salaamati, Allah ki rehmat aur barkat ho.','Salaam ka jawab dete waqt','Abu Dawud, Tirmizi'],

['رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ','Rabbana atina fid dunya hasanatan wa fil akhirati hasanatan wa qina azaban nar','Ae humare Rab! Humein duniya mein bhalai de, aakhirat mein bhalai de aur aag ke azaab se bacha.','Roz ki bhalai ke liye','Surah Baqarah 201'],

function mkItem(o){return Object.assign({t:'',say:'',r:'',n:''},o);}
function syl(L,v){
  const base=L.c==='ا'?'أ':L.c;
  const mk={a:FATHA,i:KASRA,u:DAMMA,an:FATHATAN,in:KASRATAN,un:DAMMATAN}[v];
  const t=base+mk;
  const rom=(L.cs==="'"?"'":L.cs)+v;
  return mkItem({t,say:t,r:rom,heavy:L.h});
}
function sylS(L,v,sk){ // with extra suffix e.g. sukoon
  const it=syl(L,v);const t=it.t+sk;it.t=t;it.say=t;return it;
}
const idx=(a,b)=>LET.slice(a,b);
const noA=LET.filter(l=>l.c!=='ا'&&l.c!=='ء');
const wordItems=(arr)=>arr.map(w=>mkItem({t:w[0],say:w[0],r:w[1],n:w[2],word:1}));
const letItem=L=>mkItem({t:L.c,say:L.an,r:L.nm,n:L.mk,p:L.em,pw:L.pw,pm:L.pm,c:L.c,o:L.c,letter:1,dif:DIFF[L.c]||'',heavy:L.h,qal:L.q,nj:L.nj});

function buildCourse(){
  const out=[];let n=0;
  const add=(ph,title,items,o)=>{n++;out.push(Object.assign({id:'L'+String(n).padStart(3,'0'),ph,title,items,kind:'cards'},o||{}));};

  /* Phase 0: letters */
  const pairs=[[0,2],[2,4],[4,6],[6,8],[8,10],[10,12],[12,14],[14,16],[16,18],[18,20],[20,22],[22,24],[24,26],[26,29]];
  pairs.forEach((p,i)=>{
    const ls=idx(p[0],p[1]);
    add(0,'Harf: '+ls.map(l=>l.c).join(' '),ls.map(letItem),{kind:'letters',
      tip:'Pehle aap harf ka naam bolein, phir bachcha dohraye. Tasveer wale lafz ka pehla harf pakdwayein.',
      dpool:idx(0,Math.max(p[1],4)).map(letItem)});
    if(i===4||i===9){
      const upto=i===4?10:20;
      add(0,'Dohrana: pehle '+upto+' harf',idx(upto===10?0:10,upto).map(letItem),{kind:'letters',revise:1,qn:8,tip:'Sab harf dobara suno aur pehchano. Ghalti par pareshan nahi hona, dobara sunna.',dpool:idx(0,upto).map(letItem)});
    }
  });
  add(0,'Imtihan: sab 29 harf',LET.map(letItem).filter((_,i)=>i%2===0).concat(LET.map(letItem).filter((_,i)=>i%2===1).slice(0,6)),{kind:'letters',revise:1,qn:10,tip:'Shabash! Ab saare harf ek saath pehchano.',dpool:LET.map(letItem)});

  /* Phase 1: letter shapes */
  const shapeGroups=[['ب','ت','ث','ن','ي'],['ج','ح','خ'],['س','ش','ص','ض','ط','ظ','ع','غ'],['ف','ق','ك','ل','م','ه'],['ا','د','ذ','ر','ز','و','ء']];
  const formItem=L=>{
    const iso=L.c,ini=L.nj?'':L.c+'‍',med=L.nj?'':'‍'+L.c+'‍',fin='‍'+L.c;
    return mkItem({t:L.c,say:L.an,r:L.nm,o:L.c,forms:[iso,ini,med,fin],nj:L.nj,form:1,c:L.c,n:L.nj?'Yeh harf aage ke harf se nahi judta. Is liye iski shuru aur beech wali shakl nahi.':'Awaaz wahi rehti hai, sirf shakl lafz mein badalti hai.'});
  };
  shapeGroups.forEach((g,i)=>{
    const ls=g.map(c=>LET.find(l=>l.c===c));
    add(1,i<4?'Harf ki shaklen '+(i+1):'Jo aage nahi judte',ls.map(formItem),{kind:'forms',
      tip:'Har harf lafz ke shuru, beech aur aakhir mein alag shakl leta hai. Awaaz ek hi rehti hai.',
      dpool:LET.map(formItem)});
  });

  /* Phase 2: harakat */
  const groups=[[0,10],[10,20],[20,29]];
  const H=[['a','Zabar (فَتْحَة)','Zabar: munh kholkar "a" ki awaaz. Harf ke upar chhoti si tirchhi lakeer.'],['i','Zer (كَسْرَة)','Zer: "i" ki awaaz. Harf ke neeche chhoti si tirchhi lakeer.'],['u','Pesh (ضَمَّة)','Pesh: honth gol karke "u" ki awaaz. Harf ke upar chhota sa "9" jaisa nishaan.']];
  H.forEach((h,hi)=>{
    groups.forEach((g,gi)=>{
      const its=idx(g[0],g[1]).map(l=>syl(l,h[0]));
      add(2,h[1]+' - '+(gi+1),its,{kind:'syl',tip:h[2]+' Moti awaaz wale harf (خ ص ض ط ظ غ ق) moti awaaz se parhein.',dpool:idx(0,29).map(l=>syl(l,h[0]))});
    });
  });
  const mixH=['a','i','u'];
  for(let k=0;k<3;k++){
    const its=[];
    LET.forEach((l,i)=>{if((i+k)%3===0)its.push(syl(l,mixH[(i+k)%3===0?(i+2*k)%3:0]));});
    const mixed=LET.filter((l,i)=>(i+k)%3===0).map((l,j)=>syl(l,mixH[(j+k)%3]));
    const words=k===0?W_FATHA.slice(0,5):k===1?W_KASRA.concat(W_DAMMA.slice(0,2)):W_DAMMA.slice(2).concat(W_FATHA.slice(5));
    add(2,'Zabar zer pesh: milawat '+(k+1),mixed.concat(wordItems(words)),{kind:'syl',tip:'Ab teeno harkatein milkar aati hain. Dhyan se sunein: "a" "i" "u". Aakhir mein chhote lafz padhna shuru karte hain.',dpool:LET.map((l,i)=>syl(l,mixH[i%3]))});
  }

  /* Phase 3: tanween */
  const TW=[['an','Do zabar (ــً)','Do zabar: "an" ki awaaz, jaise "ban". Harf ke upar do tirchhi lakeerein.',FATHATAN],['in','Do zer (ــٍ)','Do zer: "in" ki awaaz, jaise "bin".',KASRATAN],['un','Do pesh (ــٌ)','Do pesh: "un" ki awaaz, jaise "bun".',DAMMATAN]];
  TW.forEach((t,ti)=>{
    add(3,'Tanween: '+t[1],idx(1,13).filter((_,i)=>i!==7).map(l=>syl(l,t[0])),{kind:'syl',tip:t[2]+' Tanween mein aakhir mein halki "n" ki awaaz aati hai.',dpool:idx(1,29).map(l=>syl(l,t[0]))});
  });
  add(3,'Tanween: dohrana',LET.filter((l,i)=>i>0&&i%3===1).map((l,j)=>syl(l,['an','in','un'][j%3])),{kind:'syl',revise:1,tip:'Teeno tanween ek saath: "an" "in" "un".',dpool:idx(1,29).map((l,j)=>syl(l,['an','in','un'][j%3]))});

  /* Phase 4: madd letters */
  const mdBase=idx(1,13).filter(l=>!'دذرز'.includes(l.c)).slice(0,9);
  const mkMadd=(L,kind)=>{
    const b=L.c;const t=kind==='a'?b+FATHA+'ا':kind==='i'?b+KASRA+'ي':b+DAMMA+'و';
    const rom=L.cs+(kind==='a'?'aa':kind==='i'?'ee':'oo');
    return mkItem({t,say:t,r:rom,heavy:L.h});
  };
  [['a','Alif ki madd','Zabar ke baad Alif ho to awaaz "aa" lambi kheencho (2 harkat).'],['i','Ya ki madd','Zer ke baad saakin Ya ho to "ee" lambi kheencho.'],['u','Waaw ki madd','Pesh ke baad saakin Waaw ho to "oo" lambi kheencho.']].forEach(m=>{
    add(4,m[1],mdBase.map(l=>mkMadd(l,m[0])),{kind:'syl',tip:m[2]+' Ginti: ek, do (do ungliyan band-kholo).',dpool:mdBase.map(l=>mkMadd(l,m[0]))});
  });
  add(4,'Madd: dohrana',mdBase.map((l,i)=>mkMadd(l,['a','i','u'][i%3])),{kind:'syl',revise:1,tip:'Teeno madd milakar. Awaaz ko do harkat tak kheencho, na kam na zyada.',dpool:mdBase.map((l,i)=>mkMadd(l,['a','i','u'][i%3]))});
  const kh=[['بٰ','Khadi zabar (ـٰ): chhota alif, "aa" ki madd.'],['بٖ','Khadi zer (ـٖ): "ee" ki madd.'],['بٗ','Ulta pesh (ـٗ): "oo" ki madd.']];
  const khItems=[];
  ['ب','ت','ث','ج','ح','خ'].forEach(c=>{
    khItems.push(mkItem({t:c+SALIF,say:c+FATHA+'ا',r:'khadi zabar'}));
    khItems.push(mkItem({t:c+SKASRA,say:c+KASRA+'ي',r:'khadi zer'}));
    khItems.push(mkItem({t:c+SDAMMA,say:c+DAMMA+'و',r:'khadi pesh'}));
  });
  add(4,'Khadi zabar, zer aur ulta pesh',khItems.slice(0,12),{kind:'syl',tip:'Khadi zabar, khadi zer aur ulta pesh bhi wahi lambi awaaz dete hain: "aa", "ee", "oo".',dpool:khItems});

  /* Phase 5: sukoon, leen, qalqalah, shaddah */
  const sk1=noA.filter(l=>!l.c.match(/[ءعهح]/)).slice(0,12);
  add(5,'Sukoon (ــْ) - 1',sk1.map(l=>sylS(l,'a',SUKUN)).map((it,i)=>{const L=sk1[i];it.t='أَ'+L.c+SUKUN;it.say=it.t;it.r="'a"+L.cs;return it;}),{kind:'syl',tip:'Sukoon (gol nishaan) ka matlab harf par thehrna nahi, aage ke harf se milakar ruk jana. Jaise "ab" "at" "as".',dpool:sk1.map(L=>mkItem({t:'أَ'+L.c+SUKUN,say:'أَ'+L.c+SUKUN,r:"'a"+L.cs}))});
  add(5,'Sukoon - 2 (zer aur pesh)',sk1.slice(0,10).map((L,i)=>{const v=i%2?KASRA:DAMMA;const b=i%2?'إِ':'أُ';return mkItem({t:b+L.c+SUKUN,say:b+L.c+SUKUN,r:(i%2?"'i":"'u")+L.cs});}),{kind:'syl',tip:'Ab zer aur pesh ke saath sukoon: "ib" "ut"...',dpool:sk1.map((L,i)=>mkItem({t:(i%2?'إِ':'أُ')+L.c+SUKUN,say:(i%2?'إِ':'أُ')+L.c+SUKUN,r:''}))});
  const leenItems=[mkItem({t:'بَوْ',say:'بَوْ',r:'baw'}),mkItem({t:'بَيْ',say:'بَيْ',r:'bay'}),mkItem({t:'تَوْ',say:'تَوْ',r:'taw'}),mkItem({t:'تَيْ',say:'تَيْ',r:'tay'}),mkItem({t:'أَوْ',say:'أَوْ',r:"'aw"}),mkItem({t:'أَيْ',say:'أَيْ',r:"'ay"})].concat(wordItems(W_LEEN));
  add(5,'Leen: Waaw aur Ya saakin',leenItems,{kind:'syl',tip:'Zabar ke baad saakin Waaw ya Ya aaye to awaaz narmi se aur bina lambi kheenche "aw" "ay" nikalti hai.',dpool:leenItems});
  const qal=['ق','ط','ب','ج','د'].map(c=>LET.find(l=>l.c===c));
  const qalItems=qal.map(L=>mkItem({t:'أَ'+L.c+SUKUN,say:'أَ'+L.c+SUKUN,r:"'a"+L.cs,n:'Qalqalah: awaaz ko halka sa uchhalo.'})).concat([mkItem({t:'أَحَدْ',say:'أَحَدْ',r:'ahad',n:'Ruk kar Daal par qalqalah'}),mkItem({t:'لَمْ يَلِدْ',say:'لَمْ يَلِدْ',r:'lam yalid',n:'Daal par qalqalah'})]);
  add(5,'Qalqalah: ق ط ب ج د',qalItems,{kind:'syl',tip:'Yaad rakhne ka tareeqa: "قُطْبُ جَدّ". In 5 harfon par sukoon ho to awaaz halki si uchhalti hai.',dpool:qalItems});
  const shd=idx(1,13).filter(l=>!'دذرز'.includes(l.c)).slice(0,10);
  add(5,'Shaddah (ــّ) - 1',shd.map(L=>{const t='أَ'+L.c+SHADDA+FATHA;return mkItem({t,say:t,r:"'a"+L.cs+L.cs+'a',n:'Shaddah ka matlab harf do baar: ek baar sukoon ke saath, ek baar harkat ke saath.'});}),{kind:'syl',tip:'Shaddah (chhota "w" jaisa nishaan) wale harf ko do baar parhte hain, thoda zor se.',dpool:shd.map(L=>{const t='أَ'+L.c+SHADDA+FATHA;return mkItem({t,say:t,r:''});})});
  add(5,'Shaddah - 2 (zer, pesh aur lafz)',[['رَبِّ','rabbi','Mere Rab'],['رَبُّ','rabbu','Rab'],['ثُمَّ','summa','Phir'],['إِنَّ','inna','Beshak'],['أُمّ','ummu','Ammi'],['حَقّ','haqq','Sach']].map(w=>mkItem({t:w[0],say:w[0],r:w[1],n:w[2],word:1})),{kind:'syl',tip:'Noon aur Meem par shaddah ho to naak se ghunna (do harkat) zaroor karo.',dpool:[]});

  /* Phase 6: noon sakin / tanween / meem sakin rules */
  const R=(t,r,n)=>mkItem({t,say:t,r,n,word:1});
  const rule=(ph,title,tip,items)=>add(ph,title,items,{kind:'rule',tip});
  rule(6,'Izhaar (saaf parhna)','Noon saakin ya tanween ke baad halq ke 6 harf (ء ه ع ح غ خ) aayein to noon bilkul saaf parha jata hai, ghunna nahi.',[R('مَنْ آمَنَ','man aamana','Noon saaf'),R('أَنْعَمْتَ','an-amta','Noon saaf'),R('سَمِيعٌ عَلِيمٌ','samee-un aleem','Tanween saaf'),R('مِنْ هَادٍ','min haad','Noon saaf'),R('مِنْ خَيْرٍ','min khayr','Noon saaf')]);
  rule(6,'Idgham (milana)','Noon saakin ya tanween ke baad ي ر م ل و ن aayein to noon agle harf mein mil jata hai. ي ن م و ke saath ghunna hota hai, ل ر ke saath nahi.',[R('مَنْ يَقُولُ','may-yaqool','Ghunna ke saath'),R('مِنْ وَالٍ','miw-waal','Ghunna ke saath'),R('مِنْ رَبِّهِمْ','mir-rabbihim','Bina ghunna'),R('مِنْ لَدُنْهُ','mil-ladunhu','Bina ghunna'),R('غَفُورٌ رَحِيمٌ','ghafoorur raheem','Bina ghunna')]);
  rule(6,'Iqlaab (badalna)','Noon saakin ya tanween ke baad Ba aaye to noon "Meem" ki awaaz mein badal jata hai aur honth halke se milte hain, ghunna ke saath.',[R('مِنْ بَعْدِ','mim ba-di','Noon Meem bana'),R('أَنْبِئْهُمْ','am-bi-hum','Noon Meem bana'),R('سَمِيعٌ بَصِيرٌ','samee-um baseer','Tanween Meem bana')]);
  rule(6,'Ikhfaa (chhupana)','Noon saakin ya tanween ke baad 15 harf (ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك) aayein to noon halka sa chhupa kar nak se parha jata hai.',[R('مِنْ قَبْلُ','min qabl','Ikhfaa'),R('أَنْتَ','anta','Ikhfaa'),R('جَنَّاتٍ تَجْرِي','jannaatin tajri','Tanween ikhfaa'),R('مِنْ شَرِّ','min sharr','Ikhfaa'),R('مِنْ ذَكَرٍ','min zakar','Ikhfaa')]);
  rule(6,'Meem saakin ke qaide','Meem saakin ke baad Ba ho to ikhfaa shafawi. Meem ho to idgham (milana). Baaki harf par izhaar (saaf).',[R('تَرْمِيهِمْ بِحِجَارَةٍ','tarmeehim bi-hijaarah','Ikhfaa shafawi'),R('لَهُمْ مَا','lahum maa','Idgham shafawi'),R('هُمْ فِيهَا','hum feeha','Izhaar shafawi'),R('عَلَيْهِمْ غَيْرِ','alaihim ghayri','Izhaar shafawi')]);
  rule(6,'Ghunna: Noon aur Meem mushaddad','Noon ya Meem par shaddah ho to naak se do harkat ka ghunna zaroor karo.',[R('إِنَّ','inna','Ghunna'),R('ثُمَّ','summa','Ghunna'),R('ٱلنَّاسِ','an-naas','Ghunna'),R('ٱلْجَنَّةِ','al-jannah','Ghunna'),R('عَمَّ','amma','Ghunna')]);

  /* Phase 7: lam and ra */
  rule(7,'Lam shamsi (Al ka Laam nahi parha jata)','"Al" ke baad 14 shamsi harf (ت ث د ذ ر ز س ش ص ض ط ظ ل ن) hon to Laam nahi parha jata aur agla harf shaddah ke saath parha jata hai.',[R('ٱلشَّمْسُ','ash-shams','Suraj'),R('ٱلنَّاسُ','an-naas','Log'),R('ٱلرَّحْمَٰنُ','ar-rahmaan','Rehman'),R('ٱلصَّمَدُ','as-samad','Be-niyaaz'),R('ٱلدِّينُ','ad-deen','Deen')]);
  rule(7,'Lam qamari (Al ka Laam parha jata hai)','"Al" ke baad baaki 14 harf hon to Laam saaf parha jata hai.',[R('ٱلْقَمَرُ','al-qamar','Chaand'),R('ٱلْكِتَابُ','al-kitaab','Kitaab'),R('ٱلْحَمْدُ','al-hamd','Tareef'),R('ٱلْبَيْتُ','al-bayt','Ghar'),R('ٱلْعَالَمِينَ','al-aalameen','Saare jahaan')]);
  rule(7,'Lafz "Allah" ka Laam','Allah ke Laam se pehle zabar ya pesh ho to Laam moti (pur) parha jata hai, zer ho to patla.',[R('قَالَ ٱللَّهُ','qaalallaah','Moti Laam'),R('رَسُولُ ٱللَّهِ','rasoolullaah','Moti Laam'),R('بِسْمِ ٱللَّهِ','bismillaah','Patla Laam'),R('لِلَّهِ','lillaah','Patla Laam'),R('ٱلْحَمْدُ لِلَّهِ','alhamdu lillaah','Patla Laam')]);
  rule(7,'Ra: moti ya patla','Ra par zabar ya pesh ho to moti (رَ رُ). Ra par zer ho to patla (رِ).',[R('رَبِّ','rabbi','Moti Ra'),R('رُسُل','rusul','Moti Ra'),R('رِزْق','rizq','Patla Ra'),R('فِرْعَوْن','fir-awn','Patla Ra'),R('رَحِيم','raheem','Moti Ra')]);
  rule(7,'Moti harf (خ ص ض غ ط ق ظ)','In 7 harfon ko hamesha moti awaaz mein parha jata hai, chahe zabar, zer ya pesh ho.',[R('خَلَقَ','khalaqa','Khaa, Qaaf moti'),R('صَبَرَ','sabara','Suwaad moti'),R('ضَرَبَ','daraba','Zuwaad moti'),R('غَفَرَ','ghafara','Ghain moti'),R('طَلَعَ','tala-a','Toay moti'),R('ظَلَمَ','zalama','Zoay moti')]);

  /* Phase 8: madd, waqf, hamzat wasl */
  rule(8,'Madd asli (do harkat)','Alif, Ya ya Waaw madd ke baad Hamza ya sukoon na ho to do harkat ki madd.',[R('قَالَ','qaala','2 harkat'),R('يَقُولُ','yaqoolu','2 harkat'),R('قِيلَ','qeela','2 harkat'),R('نُورٌ','noorun','2 harkat')]);
  rule(8,'Madd muttasil aur munfasil','Madd ke harf ke baad usi lafz mein Hamza ho to madd muttasil (4-5 harkat). Agle lafz mein Hamza ho to madd munfasil (4-5 harkat).',[R('جَاءَ','jaa-a','Muttasil: 4 harkat'),R('ٱلسَّمَاءِ','as-samaa-i','Muttasil'),R('يَٰٓأَيُّهَا','yaa ayyuha','Munfasil'),R('بِمَآ أُنزِلَ','bimaa unzila','Munfasil')]);
  rule(8,'Waqf (ruk kar parhna)','Lafz par ruk jao to tanween ke zabar par "aa" ban jata hai, gol Ta (ة) "Haa" ban jati hai aur aakhri harf saakin hota hai.',[R('أَحَدٌ','ahad (ruk kar)','Aakhri harf saakin'),R('رَحْمَةً','rahmah (ruk kar)','Ta ki jagah Haa'),R('نَارًا','naaraa (ruk kar)','Do zabar ki jagah Alif'),R('ٱلرَّحِيمِ','ar-raheem (ruk kar)','Zer saakin')]);
  rule(8,'Hamzat-ul-wasl (milane wala Alif)','Lafz ke shuru ka Alif jab agle se mil kar parhein to nahi parha jata (jaise "وَٱلْقَمَر"). Lafz se shuru karein to Zabar, Zer ya Pesh se shuru hota hai.',[R('ٱلْحَمْدُ','al-hamd','Shuru: Al'),R('ٱهْدِنَا','ihdina','Shuru: Zer'),R('ٱنْحَرْ','inhar','Shuru: Zer'),R('ٱللَّهُ','allaah','Shuru: Zabar')]);
  add(8,'Mubarak! Qaida ka imtihan',[],{kind:'exam',tip:'Ab tak seekhi hui har cheez ka imtihan. Aap ne bahut mehnat ki.'});

  /* Phase 9: Fatiha */
  const fat=SUR[1];
  const fatItems=fat.a.map((a,i)=>mkItem({t:a,say:a,a:ayahAudio(1,i+1),r:'Ayat '+(i+1),surah:1,ayah:i+1,word:1}));
  add(9,'Surah Fatiha: suno aur dohrao',fatItems,{kind:'ayah',surah:1,tip:'Har ayat sun kar 3 baar dohrao. Phir bachche se akele parhwao.'});
  add(9,'Surah Fatiha: yaad karo',fatItems,{kind:'hide',surah:1,tip:'Ab lafz chhupte jayenge. Yaad se parho.'});

  /* Phase 10: salah */
  const sItem=(s,i)=>mkItem({t:s[1],say:s[1],r:s[2],n:s[3],when:s[4],title:s[0],dua:1,nq:0});
  const S=SALAH.map(sItem);
  const sl=(title,arr,tip)=>add(10,title,arr,{kind:'dua',tip:tip||'Pehle aap parhein, phir bachcha dohraye. Har baar ghalti na ho to agla.',dpool:S});
  sl('Takbeer, Sana, Taawwuz',[S[0],S[1],S[2]]);
  sl('Ruku ki dua',[S[3],S[4]]);
  sl('Sajde ki dua',[S[5],S[6]]);
  sl('Tashahhud',[S[7]]);
  sl('Durood-e-Ibrahim',[S[8]]);
  sl('Dua-e-Masura aur Salaam',[S[9],S[10]]);
  add(10,'Dohrana: namaz ki duaein',S.slice(0,6).concat(S.slice(6)),{kind:'dua',revise:1,qn:8,tip:'Namaz ki saari duaein ek saath dohrao.',dpool:S});

  /* Phase 11: last 8 surahs */
  SUR_ORDER.forEach(sn=>{
    const s=SUR[sn];
    const its=s.a.map((a,i)=>mkItem({t:a,say:a,a:ayahAudio(sn,i+1),r:'Ayat '+(i+1),surah:sn,ayah:i+1,word:1}));
    add(11,s.u+': suno aur dohrao',its,{kind:'ayah',surah:sn,tip:'Har ayat sun kar 3 baar dohrao.'});
    add(11,s.u+': yaad karo',its,{kind:'hide',surah:sn,tip:'Lafz chhupte jayenge. Yaad se parho.'});
  });

  /* revision weeks every 12 lessons (3 recap lessons) */
  const final=[];let since=[];let count=0;
  out.forEach((l,i)=>{
    final.push(l);since.push(l);count++;
    const nextPh=out[i+1]?out[i+1].ph:-1;
    if(count%12===0&&out[i+1]&&l.ph<=9){
      const pool=[];since.slice(-12).forEach(x=>x.items.filter(it=>!it.nq&&!it.word).slice(0,3).forEach(it=>pool.push(it)));
      const base=pool.length?pool:[];
      for(let r=0;r<3;r++){
        const part=base.filter((_,j)=>j%3===r);
        if(part.length<3)continue;
        final.push({id:'R'+String(count)+String.fromCharCode(65+r),ph:l.ph,title:'Dohrana hafta - '+(r+1),items:part.slice(0,12),kind:'recap',revise:1,qn:8,tip:'Pichhle dino ka dohrana. Khel khel mein.',dpool:base,rev:1});
      }
      since=[];
    }
  });
  return final;
}

let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,at,v){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;g.gain.value=v||.15;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+(at||0)+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+(at||0));o.stop(a.currentTime+(at||0)+d);}catch(e){}}
const sfx={ok(){tone(660,.15,0);tone(880,.25,.12);},no(){tone(200,.25,0,.1);},win(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,i*.14));}};
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[];}catch(e){voices=[];}}
try{loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
const voiceFor=p=>voices.find(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith(p));

/* teacher recordings in IndexedDB */
const recs=new Map();let idb=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('qari',1);r.onupgradeneeded=()=>r.result.createObjectStore('rec');r.onsuccess=()=>{idb=r.result;const tx=idb.transaction('rec');const st=tx.objectStore('rec');const q=st.openCursor();q.onsuccess=()=>{const c=q.result;if(c){recs.set(c.key,c.value);c.continue();}else res();};q.onerror=()=>res();};r.onerror=()=>res();}catch(e){res();}});}
function recPut(k,b){recs.set(k,b);try{idb.transaction('rec','readwrite').objectStore('rec').put(b,k);}catch(e){}}
function recDel(k){recs.delete(k);try{idb.transaction('rec','readwrite').objectStore('rec').delete(k);}catch(e){}}
let cur_audio=null;
function stopAudio(){try{speechSynthesis.cancel();}catch(e){}if(cur_audio){try{cur_audio.pause();}catch(e){}cur_audio=null;}}
function playUrl(u){return new Promise(res=>{const a=new Audio(u);cur_audio=a;a.onended=()=>res(true);a.onerror=()=>res(false);const p=a.play();if(p&&p.catch)p.catch(()=>res(false));});}
function tts(text,lang,rate){return new Promise(res=>{try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;const v=voiceFor(lang.slice(0,2).toLowerCase());if(v)u.voice=v;u.rate=rate||.6;u.onend=()=>res(true);u.onerror=()=>res(false);speechSynthesis.speak(u);}catch(e){res(false);}});}
/* say an item or plain text. opts: lang */
async function say(it,opt){
  opt=opt||{};stopAudio();ac();
  const key=typeof it==='string'?it:(it.say||it.t);
  const b=recs.get(key);
  if(b){return playUrl(URL.createObjectURL(b));}
  if(it&&it.a){const ok=await playUrl(it.a);if(ok)return true;}
  const lang=opt.lang||'ar-SA';
  return tts(key,lang,opt.rate||(lang==='ar-SA'?.55:.85));
}
let mr=null,mchunks=[],mstream=null,myLast=null;
async function recStart(){
  if(!navigator.mediaDevices||!window.MediaRecorder)throw new Error('nomic');
  mstream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mt=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  mr=new MediaRecorder(mstream,mt?{mimeType:mt}:{});mchunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)mchunks.push(e.data);};
  mr.start();
}
function recStop(){return new Promise(res=>{if(!mr){res(null);return;}mr.onstop=()=>{const b=new Blob(mchunks,{type:mr.mimeType||'audio/webm'});try{mstream.getTracks().forEach(t=>t.stop());}catch(e){}mr=null;res(b);};try{mr.stop();}catch(e){res(null);}});}

function weekCount(){const wk=weekKey(Date.now());return (kid().log||[]).filter(t=>weekKey(t)===wk).length;}

/* ---------- lesson player ---------- */
function duaForLesson(i){
  const L=COURSE[i];if(L.ph>8||L.rev||L.kind==='exam')return null;
  let n=0;for(let j=0;j<i;j++){const x=COURSE[j];if(x.ph<=8&&!x.rev&&x.kind!=='exam')n++;}
  return {d:DUAS[n%DUAS.length],fresh:n<DUAS.length,n:n%DUAS.length};
}
function examItems(){
  const pool=[];COURSE.forEach(l=>{if(l.ph<=8&&!l.rev&&l.kind!=='exam'){const its=l.items.filter(x=>!x.word&&!x.form);if(its.length)pool.push(its[Math.floor(its.length/2)]);}});
  return shuffle(pool).slice(0,14);
}
function viewLesson(i){
  const L=Object.assign({},COURSE[i]);
  if(L.kind==='exam'){L.items=examItems();L.dpool=L.items;L.qn=12;}
  const p=PH[L.ph];
  const dua=duaForLesson(i);
  const steps=[];
  if(dua)steps.push({t:'dua'});
  if(L.kind!=='exam'&&!L.rev&&L.kind!=='recap'){L.items.slice(0,14).forEach(it=>steps.push({t:'card',it}));}
  if(L.tip)steps.push({t:'tip'});
  if(L.kind==='hide'){[0,1,2].forEach(h=>steps.push({t:'hide',h}));}
  else if(L.items.length>1&&L.kind!=='exam')steps.push({t:'grid'});
  steps.push({t:'quiz'});
  steps.push({t:'done'});
  let si=0,quiz=null,qi=0,wrong=0,qstate=null,xpGain=0;
  V.innerHTML='';
  const head=el('div','lhead');head.style.background=p.c;
  const back=txt('button','ib','✕');back.setAttribute('aria-label','Band karein');back.onclick=()=>{if(confirm('Dars beech mein chhod dein?'))go(viewHome);};
  const bar=el('div','pbar','<i></i>');
  head.appendChild(back);head.appendChild(bar);V.appendChild(head);
  const body=el('div','lbody');V.appendChild(body);
  const foot=el('div','lfoot');V.appendChild(foot);
  function prog(){bar.firstChild.style.width=Math.round(si/(steps.length-1)*100)+'%';}
  function next(){si++;if(si>=steps.length)si=steps.length-1;render();}
  function prev(){if(si>0){si--;render();}}
  function navFoot(showNext,label){foot.innerHTML='';if(si>0&&steps[si].t!=='done'&&steps[si].t!=='quiz'){const b=bigBtn('←','ghost small',prev);foot.appendChild(b);}if(showNext){foot.appendChild(bigBtn(label||'Aage →','go',next));}}
  function speakBtn(it,lang,label){const b=bigBtn('🔊 '+(label||'Suno'),'blue',()=>say(it,{lang}));return b;}
  function teacherBar(it){
    if(!S.teacher)return null;const key=it.say||it.t;const w=el('div','tbar');
    const has=recs.has(key);w.appendChild(txt('small','',has?'Aapki awaaz mehfooz hai ✔':'Ustad mode: apni awaaz record karein'));
    const b=bigBtn(mr?'⏹ Rokein':'🎙 Record','ghost',async()=>{
      if(!mr){try{await recStart();b.textContent='⏹ Rokein';}catch(e){toast('Mic ki ijazat dein');}}
      else{const blob=await recStop();if(blob){recPut(key,blob);toast('Awaaz mehfooz ho gayi');render();}}
    });w.appendChild(b);
    if(has){w.appendChild(bigBtn('🗑','ghost small',()=>{recDel(key);render();}));}
    return w;
  }
  function render(){

  const ob=bigBtn(S.openAll?'Sab dars khule hain (band karein)':'Sab dars khol dein',S.openAll?'go':'ghost',()=>{S.openAll=!S.openAll;save();go(viewParents);});c5.appendChild(ob);V.appendChild(c5);
  const c6=el('div','card');c6.appendChild(txt('h2','','Backup'));
  c6.appendChild(bigBtn('Progress file mein mehfooz karein','ghost',()=>{dl('nanhe-qari-progress.json',JSON.stringify(S));}));
  const pi=el('input');pi.type='file';pi.accept='.json';pi.hidden=true;pi.onchange=async()=>{try{const t=await pi.files[0].text();const o=JSON.parse(t);if(o&&Array.isArray(o.kids)){S=o;save();toast('Progress wapas aa gaya');go(viewWho);}}catch(e){toast('File sahi nahi');}};
  c6.appendChild(bigBtn('Progress file se wapas lein','ghost',()=>pi.click()));c6.appendChild(pi);
  c6.appendChild(bigBtn('Is bachche ka progress mitayein','bad',()=>{if(confirm(k.name+' ka sara progress mit jayega. Pakka?')){k.done={};k.xp=0;k.log=[];k.badges=[];k.stories={};k.qa={};save();go(viewHome);}}));
  V.appendChild(c6);
  V.appendChild(el('p','note','Ahem: yeh app ek madadgaar hai. Harf, tajweed aur duaon ki tasdeeq kisi qari ya ustad se zaroor karwayein. Namaz ke alfaaz/tareeqe mein madhhab ke mutabiq farq ho sakta hai.'));
}
function dl(name,text){const a=el('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
function b64ofBlob(b){return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b);});}
async function exportRecs(){const o={};for(const [k,b] of recs){o[k]=await b64ofBlob(b);}if(!Object.keys(o).length){toast('Abhi koi awaaz record nahi hai');return;}dl('nanhe-qari-awaaz.json',JSON.stringify(o));}
async function importRecs(f){if(!f)return;try{const o=JSON.parse(await f.text());let n=0;for(const k in o){const r=await fetch(o[k]);recPut(k,await r.blob());n++;}toast(n+' awaazein aa gayin');}catch(e){toast('File sahi nahi');}}

(async function(){
  await idbOpen();
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('chat-sw.js');}catch(e){}
  if(S.cur>=0&&S.kids[S.cur])go(viewHome);else go(viewWho);
  window.__t={S:()=>S,COURSE,go,viewHome,viewMap,viewLesson,viewStories,viewStory,viewQA,viewQASet,viewQAQuiz,viewParents,viewPractice,say,hasVoice};
})();


})();
